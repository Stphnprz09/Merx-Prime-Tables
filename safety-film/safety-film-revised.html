<style>
.merx-safety-table{
    width:100%;
    border-collapse:collapse;
    font-family:Arial, Helvetica, sans-serif;
    font-size:17px;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,.08);
    margin:30px auto;
}

.merx-safety-table th,
.merx-safety-table td{
    padding:16px 18px;
    border:1px solid #e5e5e5;
    text-align:center;
    vertical-align:middle;
}

.merx-safety-table thead tr:first-child{
    background:#812019;
    color:#fff;
    font-size:22px;
}

.merx-safety-table thead tr:nth-child(2){
    background:#9d2933;
    color:#fff;
    font-size:18px;
}

.merx-safety-table tbody tr:nth-child(even){
    background:#fafafa;
}

.merx-safety-table tbody tr:hover th,
.merx-safety-table tbody tr:hover td{
    background:#f8eeee;
    transition:background .3s ease;
}

.merx-safety-table tbody th{
    background:#fcf6f6;
    color:#333;
    font-weight:600;
}
</style>

<table class="merx-safety-table">
<thead>
<tr>
  <th rowspan="2">Specifications</th>
  <th colspan="2">Safety Film</th>
</tr>

<tr>
  <th>SF-2Mil</th>
  <th>SF-4Mil</th>
</tr>
</thead>

<tbody>
<tr>
  <th>Thickness &amp; Structure</th>
  <td>2Mil / 1Ply</td>
  <td>4Mil / 1Ply</td>
</tr>
</tbody>
</table>
